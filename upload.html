<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>送出我的壓力小怪獸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: single phone column — pick photo, see the cut-out, name it, send. Same sketchbook look as the big screen. */
:root {
  --paper: #fbf3e4;
  --grid: #ead9bd;
  --ink: #3a2e28;
  --ink-soft: #7a6a5e;
  --accent: #f4c542;
  --accent-ink: #3a2e28;
  --calm: #3fa58a;
  --chip: #ffffff;
  --line: #3a2e28;
  --font-display: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  background: radial-gradient(ellipse at center, #f6e7cb 0, #e9cfa6 100%) fixed;
  background-color: #e9cfa6;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
}
main {
  max-width: 480px; margin: 0 auto;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px;
}
h1 { margin: 0; font-family: var(--font-display); font-weight: 900; font-size: 28px; line-height: 1.2; text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }
.card {
  background: var(--chip); border: 2.5px solid var(--line); border-radius: 20px;
  box-shadow: 4px 4px 0 var(--line); padding: 16px; display: grid; gap: 12px;
}
.step { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink-soft); letter-spacing: .03em; }
.pick {
  display: grid; place-items: center; gap: 6px;
  min-height: 200px; border: 2.5px dashed var(--line); border-radius: 16px;
  background:
    conic-gradient(#eee6d6 25%, #fff 0 50%, #eee6d6 0 75%, #fff 0) 0 0 / 20px 20px;
  cursor: pointer; text-align: center; padding: 12px;
  font-family: var(--font-display); font-weight: 700; font-size: 18px;
}
.pick img { max-width: 100%; max-height: 320px; display: block; }
.pick small { font-family: var(--font-body); font-weight: 400; color: var(--ink-soft); font-size: 13px; }
input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
label.field { display: grid; gap: 6px; font-family: var(--font-display); font-weight: 700; }
label.field input[type=text] {
  font: inherit; font-family: var(--font-body); font-weight: 400; font-size: 17px;
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--paper); color: var(--ink);
  width: 100%;
}
.row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); }
.row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
button.send {
  font-family: var(--font-display); font-weight: 900; font-size: 20px;
  background: var(--accent); color: var(--accent-ink);
  border: 2.5px solid var(--line); border-radius: 16px; padding: 14px;
  box-shadow: 3px 3px 0 var(--line); cursor: pointer; width: 100%;
}
button.send:disabled { opacity: .45; cursor: not-allowed; }
button.send:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--line); }
button:focus-visible, input:focus-visible, .pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.msg { font-size: 14px; color: var(--ink-soft); text-align: center; margin: 0; }
.msg.err { color: #c0392b; font-weight: 700; }
.done { text-align: center; }
.done .big { font-family: var(--font-display); font-weight: 900; font-size: 26px; margin: 0; }
.done img { max-width: 60%; margin: 8px auto; display: block; }
.again {
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  background: var(--paper); color: var(--ink); border: 2px solid var(--line); border-radius: 14px;
  padding: 10px 16px; cursor: pointer;
}
</style>
</head>
<body>
<main>
  <header>
    <h1>送出我的壓力小怪獸</h1>
    <p class="lead">拍下你畫的怪獸，牠會馬上出現在大螢幕上。</p>
  </header>

  <section class="card" id="form">
    <div class="step">1・拍照或選照片</div>
    <label class="pick" for="photo" id="pick">
      <span id="pickText">📷 點這裡拍怪獸<br><small>在白紙上畫、光線亮一點，去背最漂亮</small></span>
      <img id="preview" alt="去背後的怪獸預覽" hidden>
      <input type="file" id="photo" accept="image/*">
    </label>
    <div class="row" id="cutRow" hidden>
      <span>去白底</span>
      <input type="range" id="cut" min="0" max="100" value="60" aria-label="去白底強度">
    </div>

    <div class="step">2・幫怪獸取名字</div>
    <label class="field" for="name">怪獸名字
      <input type="text" id="name" maxlength="16" placeholder="例如：想太多怪" autocomplete="off">
    </label>
    <label class="field" for="weak">牠的弱點（紓壓方法，可不填）
      <input type="text" id="weak" maxlength="20" placeholder="例如：散步、聽音樂" autocomplete="off">
    </label>

    <button type="button" class="send" id="send" disabled>送出怪獸！</button>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>

  <section class="card done" id="done" hidden>
    <p class="big">送出成功！</p>
    <img id="doneImg" alt="">
    <p class="msg">抬頭看大螢幕，你的怪獸來了 👀</p>
    <button type="button" class="again" id="again">再送一隻</button>
  </section>
</main>

<script type="module">
import { firebaseConfig } from './firebase-config.js';

const $ = (id) => document.getElementById(id);
const photo = $('photo'), preview = $('preview'), pickText = $('pickText');
const cut = $('cut'), cutRow = $('cutRow'), send = $('send'), msg = $('msg');
const room = (new URLSearchParams(location.search).get('room') || 'CLASS').toUpperCase().slice(0, 12);

let original = null;
let result = '';

function setMsg(t, err) { msg.textContent = t; msg.className = 'msg' + (err ? ' err' : ''); }

  // white sticker border so each drawing looks cut out of paper
const sticker = (src) => {
    const bw = Math.max(3, Math.round(Math.max(src.width, src.height) * 0.022));
    const sil = document.createElement('canvas'); sil.width = src.width; sil.height = src.height;
    const sx = sil.getContext('2d'); sx.drawImage(src, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = '#ffffff'; sx.fillRect(0, 0, sil.width, sil.height);
    const o = document.createElement('canvas'); o.width = src.width + bw * 2; o.height = src.height + bw * 2;
    const ox = o.getContext('2d');
    for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; ox.drawImage(sil, bw + Math.cos(a) * bw, bw + Math.sin(a) * bw); }
    ox.drawImage(src, bw, bw);
    return o;
  };

function processImage(img, strength, maxSide) {
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * scale));
  const h = Math.max(1, Math.round(img.naturalHeight * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  let minX = 0, minY = 0, maxX = w - 1, maxY = h - 1;
  if (strength > 0) {
    const data = ctx.getImageData(0, 0, w, h);
    const d = data.data;
    const T = 250 - strength, soft = 28;
    // flood-fill from the photo's edges: only paper connected to the border turns clear,
    // so white parts inside the drawing (eyes, teeth) stay
    const isPaper = (p) => { const r = d[p], g = d[p + 1], b = d[p + 2]; return Math.max(r, g, b) - Math.min(r, g, b) < 45 && (r + g + b) / 3 > T - soft; };
    const seen = new Uint8Array(w * h);
    const stack = new Int32Array(w * h);
    let sp = 0;
    const push = (x, y) => { const k = y * w + x; if (!seen[k] && isPaper(k * 4)) { seen[k] = 1; stack[sp++] = k; } };
    for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
    for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
    while (sp) {
      const k = stack[--sp], x = k % w, y = (k - x) / w, i = k * 4;
      const light = (d[i] + d[i + 1] + d[i + 2]) / 3;
      const a = light >= T ? 0 : 1 - (light - (T - soft)) / soft;
      d[i + 3] = Math.round(d[i + 3] * a);
      if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y);
      if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
    }
    minX = w; minY = h; maxX = -1; maxY = -1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (d[(y * w + x) * 4 + 3] > 24) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
    ctx.putImageData(data, 0, 0);
    if (maxX < 0) { minX = 0; minY = 0; maxX = w - 1; maxY = h - 1; }
  }
  const cw = maxX - minX + 1, ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, cw, ch);
  const final = strength > 0 ? sticker(out) : out;
  // webp keeps transparency and is small; browsers that can't encode it fall back to png
  let url = final.toDataURL('image/webp', 0.82);
  if (!url.startsWith('data:image/webp')) url = final.toDataURL('image/png');
  return url;
}

function render() {
  if (!original) return;
  let size = 380;
  result = processImage(original, +cut.value, size);
  while (result.length > 700000 && size > 160) { size -= 60; result = processImage(original, +cut.value, size); }
  preview.src = result;
  preview.hidden = false; pickText.hidden = true; cutRow.hidden = false;
  send.disabled = false;
}

photo.addEventListener('change', async () => {
  const f = photo.files[0];
  if (!f) return;
  setMsg('處理中…');
  try {
    const img = new Image();
    img.src = URL.createObjectURL(f);
    await img.decode();
    original = img;
    render();
    setMsg('');
  } catch (e) {
    setMsg('這張照片讀不出來，換一張試試', true);
  }
});
let t;
cut.addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 120); });

const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('貼上');
let addDoc, collection, db;
if (!configured) {
  setMsg('這個頁面還沒設定好，請通知負責的組員', true);
} else {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const fs = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  db = fs.getFirestore(initializeApp(firebaseConfig));
  addDoc = fs.addDoc; collection = fs.collection;
}

send.addEventListener('click', async () => {
  if (!result || !configured) return;
  send.disabled = true;
  setMsg('送出中…');
  try {
    await addDoc(collection(db, 'monsters'), {
      room,
      img: result,
      name: $('name').value.trim().slice(0, 16),
      weak: $('weak').value.trim().slice(0, 20),
      createdAt: Date.now()
    });
    $('doneImg').src = result;
    $('form').hidden = true; $('done').hidden = false;
    setMsg('');
  } catch (e) {
    send.disabled = false;
    setMsg('送出失敗，檢查一下網路再按一次', true);
  }
});

$('again').addEventListener('click', () => {
  original = null; result = '';
  photo.value = ''; $('name').value = ''; $('weak').value = '';
  preview.hidden = true; pickText.hidden = false; cutRow.hidden = true; send.disabled = true;
  $('done').hidden = true; $('form').hidden = false;
});
</script>
</body>
</html>
