<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style></head><body class="hide-names"><title>壓力小怪獸樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one full-screen "sketchbook" stage where monsters roam; floating title chip top-left, counter top-right, toolbar pinned to the bottom. Single deliberate paper look for classroom projection. */
:root {
  --paper: #fbf3e4;
  --grid: #ead9bd;
  --ink: #3a2e28;
  --ink-soft: #7a6a5e;
  --accent: #f4c542;
  --accent-ink: #3a2e28;
  --calm: #6f9e76;
  --heart: #e0795f;
  --chip: #fffaf0f2;
  --line: #3a2e28;
  --font-display: "Zen Maru Gothic", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
}
#stage {
  position: fixed; inset: 0;
  background: #e9cfa6;
  overflow: hidden;
  touch-action: none;
  cursor: grab;
}
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
body.viewer .host-only { display: none !important; }
#map { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
.top {
  position: fixed; z-index: 5;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  pointer-events: none;
}
.title {
  background: var(--chip);
  border: 2.5px solid var(--line);
  border-radius: 18px;
  padding: 8px 16px 10px;
  box-shadow: 4px 4px 0 var(--line);
  transform: rotate(-1.5deg);
  min-width: 0;
  position: relative;
}
.title::before {
  content: ""; position: absolute; left: 50%; top: -12px; width: 84px; height: 22px;
  transform: translateX(-50%) rotate(3deg);
  background: repeating-linear-gradient(90deg, #e8b9a0cc 0 10px, #f1cdb8cc 10px 20px);
}
.title h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 900;
  font-size: clamp(20px, 2.6vw, 84px);
  letter-spacing: 0.02em;
  line-height: 1.15;
  text-wrap: balance;
}
.title p { margin: 2px 0 0; font-size: clamp(13px, 0.9vw, 22px); color: var(--ink-soft); }
.count {
  background: var(--chip);
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(15px, 1vw, 32px);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.count b { color: var(--calm); }

.bar {
  position: fixed; z-index: 5;
  left: 50%; transform: translateX(-50%);
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: min(calc(100% - 32px), max(980px, 62vw));
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
  background: var(--chip);
  border: 2.5px solid var(--line);
  border-radius: 22px;
  padding: 10px 12px;
  box-shadow: 4px 4px 0 var(--line);
}
.bar button, .bar label.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(15px, 0.95vw, 32px);
  color: var(--ink);
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 12px;
  padding: 0.5em 0.95em;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: 2px 2px 0 var(--line);
}
.bar button:hover, .bar label.btn:hover { transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--line); }
.bar button:active, .bar label.btn:active { transform: translate(1px,1px); box-shadow: 0 0 0 var(--line); }
.bar button:focus-visible, .bar label.btn:focus-within, .bar input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar .primary { background: var(--accent); color: var(--accent-ink); }
.bar .calm { background: var(--calm); color: #fffaf0; }
.bar input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.bar .slider { display: inline-flex; align-items: center; gap: 6px; font-size: clamp(13px, 0.85vw, 22px); color: var(--ink-soft); }
.bar .slider input { width: clamp(96px, 7vw, 200px); accent-color: var(--accent); }
.bar .sep { width: 2px; align-self: stretch; background: var(--grid); border-radius: 2px; }
.bar button[aria-pressed="false"] { opacity: .6; }

/* monsters */
.m {
  position: absolute; left: 0; top: 0; z-index: 1;
  will-change: transform;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}
.m { transform-origin: 0 0; }
.m.relaxed img { filter: drop-shadow(0 0 7px rgba(255,214,120,.95)) drop-shadow(0 5px 4px rgba(70,50,25,.28)); }
.m .mine-tag {
  position: absolute; left: 50%; bottom: 100%;
  transform: translate(-50%, -6px);
  font-family: var(--font-display); font-weight: 900; font-size: clamp(12px, 0.8vw, 24px);
  background: var(--accent); color: var(--accent-ink); border: 2px solid var(--line); border-radius: 999px;
  padding: 0.1em 0.7em; white-space: nowrap; animation: bob 1.2s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translate(-50%, -12px); } }
.m .body { display: block; transform-origin: 50% 100%; will-change: transform; }
.m img { display: block; width: 100%; height: auto; pointer-events: none; filter: drop-shadow(0 5px 4px rgba(70,50,25,.28)); -webkit-user-drag: none; }
.m .shadow {
  position: absolute; left: 12%; right: 12%; bottom: -6px; height: 12%;
  background: rgba(70,50,25,.18); border-radius: 50%;
  z-index: -1;
}
.m .name {
  position: absolute; left: 50%; top: 100%;
  transform: translate(-50%, 3px);
  font-family: var(--font-display); font-weight: 700; font-size: clamp(11px, 0.7vw, 22px);
  background: var(--chip); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 0.05em 0.7em; white-space: nowrap; color: var(--ink);
  max-width: max(220px, 16vw); overflow: hidden; text-overflow: ellipsis;
}
.m .name:empty { display: none; }
body.hide-names .m .name { display: none; }
.m .tag {
  position: absolute; right: -6px; top: -6px;
  font-size: 11px; font-weight: 700; background: var(--ink); color: var(--paper);
  border-radius: 6px; padding: 1px 6px;
}
.bubble {
  position: absolute; z-index: 4; pointer-events: none;
  font-family: var(--font-display); font-weight: 900; font-size: clamp(18px, 1.3vw, 34px);
  background: var(--chip); border: 2.5px solid var(--line); border-radius: 14px;
  padding: 4px 12px; white-space: nowrap; color: var(--ink);
  animation: pop 1.6s ease forwards;
}
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 6px) scale(.6); }
  12% { opacity: 1; transform: translate(-50%, 0) scale(1.05); }
  20% { transform: translate(-50%, 0) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%, -10px); }
}
.heart {
  position: absolute; z-index: 3; pointer-events: none;
  color: var(--heart); font-size: clamp(22px, 1.5vw, 40px); line-height: 1;
  animation: rise 1.3s ease-out forwards;
}
.heart.calm { color: var(--calm); }
@keyframes rise {
  from { opacity: 1; transform: translate(0,0) scale(.6); }
  to { opacity: 0; transform: translate(var(--dx), -90px) scale(1.2); }
}
.drop {
  position: fixed; inset: 0; z-index: 9;
  display: grid; place-items: center;
  background: rgba(251,247,238,.82);
  border: 6px dashed var(--accent);
  font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 4vw, 40px);
  color: var(--ink);
}
.toast {
  position: fixed; z-index: 8; left: 50%; transform: translateX(-50%);
  top: calc(80px + env(safe-area-inset-top, 0px));
  background: var(--ink); color: var(--paper);
  font-family: var(--font-display); font-weight: 700; font-size: 15px;
  padding: 8px 16px; border-radius: 12px;
}
.qr-chip {
  position: fixed; z-index: 6;
  right: max(16px, env(safe-area-inset-right, 0px));
  top: calc(clamp(64px, 4.5vw, 120px) + env(safe-area-inset-top, 0px));
  background: var(--chip); border: 2.5px solid var(--line); border-radius: 16px;
  padding: 8px; text-align: center; box-shadow: 4px 4px 0 var(--line);
  font-family: var(--font-display); font-weight: 700; font-size: clamp(13px, 0.9vw, 24px); cursor: pointer;
}
.qr-chip .qr { width: clamp(112px, 8vw, 240px); height: clamp(112px, 8vw, 240px); background: #fff; margin: 0 auto 4px; }
.qr-chip .qr img, .qr-chip .qr canvas { width: 100% !important; height: 100% !important; }
.qr-big {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: rgba(43,36,51,.55);
}
.qr-big .card {
  background: var(--paper); border: 3px solid var(--line); border-radius: 24px;
  padding: 24px 28px; text-align: center; box-shadow: 6px 6px 0 var(--line);
  max-width: calc(100% - 32px);
}
.qr-big h2 { margin: 0 0 12px; font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 3.5vw, 36px); }
.qr-big .qr { width: min(60vh, 70vw); height: min(60vh, 70vw); background: #fff; padding: 12px; margin: 0 auto; box-sizing: border-box; }
.qr-big .qr img, .qr-big .qr canvas { width: 100% !important; height: 100% !important; }
.qr-big p { margin: 12px 0 0; color: var(--ink-soft); font-size: 15px; word-break: break-all; }
.qr-big .room { font-family: var(--font-display); font-weight: 900; color: var(--accent); }
@media (max-width: 560px) {
  .bar .slider span { display: none; }
  .bar button, .bar label.btn { font-size: 14px; padding: 7px 10px; }
  .title p { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .heart, .bubble { animation-duration: .01s; }
}
</style>

<div id="stage" aria-label="怪獸活動區"><div id="world"><canvas id="map" aria-hidden="true"></canvas></div></div>

<div class="top">
  <div class="title">
    <h1>壓力小怪獸樂園</h1>
    <p>拖曳地圖看怪獸・點怪獸會跳起來・按「陪牠放鬆」讓怪獸放鬆下來</p>
  </div>
  <div class="count" id="count" aria-live="polite">怪獸 0 隻</div>
</div>

<div class="bar" role="toolbar" aria-label="控制列">
  <label class="btn primary host-only" for="file">＋ 加入怪獸
    <input type="file" id="file" accept="image/*" multiple>
  </label>
  <label class="slider host-only" for="cut"><span>去白底</span>
    <input type="range" id="cut" min="0" max="100" value="60" aria-label="去白底強度">
  </label>
  <button type="button" id="names" aria-pressed="false">名字</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="calm" id="relax">陪牠放鬆 ♪</button>
  <button type="button" id="revive">重來</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="host-only" id="qrBtn" hidden>QR code</button>
  <button type="button" class="primary" id="findMe" hidden>找我的怪獸</button>
  <button type="button" id="fit">全圖</button>
  <button type="button" id="full">全螢幕</button>
  <button type="button" class="host-only" id="clear">清空・新場次</button>
</div>

<div class="qr-chip host-only" id="qrChip" hidden title="放大 QR code">
  <div class="qr" id="qrSmall"></div>掃我上傳怪獸
</div>
<div class="qr-big" id="qrBig" hidden>
  <div class="card">
    <h2>用手機掃描，把怪獸送上來！</h2>
    <div class="qr" id="qrLarge"></div>
    <p>場次代碼 <span class="room" id="roomCode"></span>・點任何地方關閉</p>
  </div>
</div>

<div class="drop" id="drop" hidden>把怪獸照片丟進來！</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const world = document.getElementById('world');
  const countEl = document.getElementById('count');
  const fileInput = document.getElementById('file');
  const cutInput = document.getElementById('cut');
  const dropEl = document.getElementById('drop');
  const toastEl = document.getElementById('toast');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const monsters = [];
  let relaxedCount = 0;
  let clearArmed = 0;

  // ---------- sample monsters (original sketch-style drawings) ----------
  const INK = '#2a2420';
  const rough = '<defs><filter id="r" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>';
  const wrap = (inner) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240">${rough}<g filter="url(#r)" fill="#fff" stroke="${INK}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
  const samples = [
    { name: '想太多怪', weak: '聽音樂', svg: wrap(`
      <path d="M50 225 C35 160 30 80 70 45 C100 20 140 22 165 55 C195 95 190 165 175 225 L150 210 L128 228 L108 208 L86 228 L66 208 Z"/>
      <circle cx="92" cy="85" r="15"/><circle cx="96" cy="88" r="5" fill="${INK}"/>
      <circle cx="140" cy="80" r="11"/><circle cx="138" cy="83" r="4" fill="${INK}"/>
      <circle cx="118" cy="115" r="18"/><circle cx="121" cy="119" r="6" fill="${INK}"/>
      <circle cx="78" cy="125" r="8"/><circle cx="79" cy="127" r="3" fill="${INK}"/>
      <circle cx="152" cy="122" r="9"/><circle cx="150" cy="124" r="3" fill="${INK}"/>
      <path d="M100 160 Q115 150 132 160" fill="none"/>
      <path d="M70 180 l10 -10 M85 190 l10 -10 M150 185 l10 -10 M160 198 l8 -8" fill="none" stroke-width="3"/>`) },
    { name: '作業長角獸', weak: '散步一下', svg: wrap(`
      <path d="M70 70 L52 8 L95 58 Z"/><path d="M150 70 L168 8 L125 58 Z"/>
      <rect x="45" y="55" width="130" height="135" rx="40"/>
      <path d="M60 190 L60 230 M95 190 L95 228 M125 190 L125 228 M160 190 L160 230" fill="none"/>
      <path d="M78 105 L100 113 M142 105 L120 113" fill="none" stroke-width="6"/>
      <circle cx="90" cy="125" r="6" fill="${INK}"/><circle cx="130" cy="125" r="6" fill="${INK}"/>
      <path d="M85 160 L135 160" fill="none"/>
      <path d="M92 153 L92 167 M104 153 L104 167 M116 153 L116 167 M128 153 L128 167" fill="none" stroke-width="3"/>
      <path d="M150 75 l12 12 M156 92 l12 12" fill="none" stroke-width="3"/>`) },
    { name: '完美皇冠怪', weak: '吃甜點', svg: wrap(`
      <path d="M70 72 L78 30 L98 56 L110 22 L122 56 L142 30 L150 72 Z"/>
      <ellipse cx="110" cy="138" rx="72" ry="66"/>
      <path d="M80 200 L72 232 M140 200 L148 232" fill="none"/>
      <ellipse cx="85" cy="128" rx="14" ry="18"/><circle cx="88" cy="133" r="6" fill="${INK}"/>
      <ellipse cx="135" cy="128" rx="14" ry="18"/><circle cx="132" cy="133" r="6" fill="${INK}"/>
      <path d="M92 170 Q110 162 128 170" fill="none"/>
      <path d="M60 155 l10 -10 M66 170 l10 -10 M150 158 l10 -10 M154 172 l8 -8" fill="none" stroke-width="3"/>`) },
    { name: '拖延刺刺怪', weak: '睡個午覺', svg: wrap(`
      <path d="M110 30 L124 62 L156 46 L152 82 L188 88 L164 114 L190 140 L156 148 L162 184 L128 172 L110 205 L92 172 L58 184 L64 148 L30 140 L56 114 L32 88 L68 82 L64 46 L96 62 Z"/>
      <path d="M86 108 m-12 0 a12 12 0 1 0 24 0 a8 8 0 1 0 -16 0 a4 4 0 1 0 8 0" fill="none" stroke-width="4"/>
      <path d="M134 108 m-12 0 a12 12 0 1 0 24 0 a8 8 0 1 0 -16 0 a4 4 0 1 0 8 0" fill="none" stroke-width="4"/>
      <path d="M92 148 Q110 140 128 150" fill="none"/>
      <path d="M95 205 L90 232 M125 205 L130 232" fill="none"/>`) }
  ];

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const VW = () => stage.clientWidth;
  const VH = () => stage.clientHeight;
  // wide screens show the whole park at once; phones get a 16:9 park they can drag around
  const bigScreen = () => VW() >= 900 && VW() / VH() >= 1.2;
  let worldW = 1600, worldH = 900;
  function sizeWorld() {
    if (bigScreen()) { worldW = VW(); worldH = VH(); }
    else { worldH = Math.max(VH(), 900); worldW = Math.round(worldH * 16 / 9); }
    world.style.width = worldW + 'px'; world.style.height = worldH + 'px';
  }
  const W = () => worldW;
  const H = () => worldH;
  // play area: keep clear of title (top) and toolbar (bottom)
  const topPad = () => bigScreen() ? Math.min(110, H() * 0.16) : 20;
  const botPad = () => { if (!bigScreen()) return 20; const bar = document.querySelector('.bar'); return (bar ? bar.offsetHeight : 60) + 34; };

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { toastEl.hidden = true; }, 2200);
  }

  function baseSize() {
    const alive = monsters.filter(m => !m.gone).length || 1;
    const area = W() * (H() - topPad() - botPad());
    // small, map-sized monsters: about 6.5% of the screen height, shrinking further when the map gets crowded
    return clamp(Math.min(H() * 0.065, Math.sqrt(area * 0.18 / alive)), 30, 200);
  }

  function nameFromFile(f) {
    let n = f.name.replace(/\.[^.]+$/, '');
    if (/^(img|dsc|pxl|photo|image|screenshot|line_|mmexport|\d)/i.test(n)) return '';
    return n.slice(0, 16);
  }

  // white sticker border so each drawing looks cut out of paper
  const sticker = (src) => {
    const bw = Math.max(3, Math.round(Math.max(src.width, src.height) * 0.022));
    const sil = document.createElement('canvas'); sil.width = src.width; sil.height = src.height;
    const sx = sil.getContext('2d'); sx.drawImage(src, 0, 0); sx.globalCompositeOperation = 'source-in'; sx.fillStyle = '#ffffff'; sx.fillRect(0, 0, sil.width, sil.height);
    const o = document.createElement('canvas'); o.width = src.width + bw * 2; o.height = src.height + bw * 2;
    const ox = o.getContext('2d');
    for (let k = 0; k < 16; k++) { const a = k / 16 * Math.PI * 2; ox.drawImage(sil, bw + Math.cos(a) * bw, bw + Math.sin(a) * bw); }
    ox.drawImage(src, bw, bw);
    return o;
  };

  // paper remover that copes with shadows: compare each pixel with the local paper brightness
  function removePaper(d, w, h, strength) {
    const n = w * h;
    const L = new Float32Array(n);
    for (let k = 0, i = 0; k < n; k++, i += 4) L[k] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    // 1) estimate how bright the paper is in each small block (bright percentile)
    const B = Math.max(8, Math.round(Math.max(w, h) / 24));
    const gw = Math.ceil(w / B), gh = Math.ceil(h / B);
    let grid = new Float32Array(gw * gh);
    const vals = [];
    for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
      vals.length = 0;
      for (let y = gy * B; y < Math.min(h, gy * B + B); y++) for (let x = gx * B; x < Math.min(w, gx * B + B); x++) vals.push(L[y * w + x]);
      vals.sort((a, b) => a - b);
      grid[gy * gw + gx] = vals[Math.floor(vals.length * 0.85)];
    }
    // 2) blocks covered by ink or colour are not paper: refill them from paper neighbours
    const sorted = Array.from(grid).sort((a, b) => a - b);
    const ref = sorted[Math.floor(sorted.length * 0.9)] || 255;
    const ok = new Uint8Array(gw * gh);
    for (let k = 0; k < grid.length; k++) ok[k] = grid[k] > ref * 0.55 ? 1 : 0;
    for (let pass = 0; pass < gw + gh; pass++) {
      let changed = false;
      const next = grid.slice(), nok = ok.slice();
      for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
        const k = gy * gw + gx; if (ok[k]) continue;
        let s = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const x = gx + dx, y = gy + dy; if (x < 0 || y < 0 || x >= gw || y >= gh) continue;
          const q = y * gw + x; if (ok[q]) { s += grid[q]; c++; }
        }
        if (c) { next[k] = s / c; nok[k] = 1; changed = true; }
      }
      grid = next; ok.set(nok);
      if (!changed) break;
    }
    for (let k = 0; k < grid.length; k++) if (!ok[k]) grid[k] = ref;
    // smooth twice
    for (let pass = 0; pass < 2; pass++) {
      const next = new Float32Array(grid.length);
      for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
        let s = 0, c = 0;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const x = gx + dx, y = gy + dy; if (x < 0 || y < 0 || x >= gw || y >= gh) continue;
          s += grid[y * gw + x]; c++;
        }
        next[gy * gw + gx] = s / c;
      }
      grid = next;
    }
    const bgAt = (x, y) => {
      const fx = Math.min(gw - 1, Math.max(0, x / B - 0.5)), fy = Math.min(gh - 1, Math.max(0, y / B - 0.5));
      const x0 = Math.floor(fx), y0 = Math.floor(fy), x1 = Math.min(gw - 1, x0 + 1), y1 = Math.min(gh - 1, y0 + 1);
      const tx = fx - x0, ty = fy - y0;
      const a = grid[y0 * gw + x0] * (1 - tx) + grid[y0 * gw + x1] * tx;
      const b = grid[y1 * gw + x0] * (1 - tx) + grid[y1 * gw + x1] * tx;
      return Math.max(1, a * (1 - ty) + b * ty);
    };
    // 3) a pixel is paper when it is nearly as bright as the paper around it and not colourful
    const cut = 1 - (0.06 + (strength / 100) * 0.28);
    const ratio = new Float32Array(n);
    const paper = new Uint8Array(n);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = y * w + x, i = k * 4;
      const bg = bgAt(x, y);
      const r = L[k] / bg;
      const chroma = (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2])) / bg;
      ratio[k] = r;
      paper[k] = r > cut && chroma < 0.22 ? 1 : 0;
    }
    // 4) flood from the photo edges so white parts inside the drawing stay
    const gone = new Uint8Array(n);
    const stack = new Int32Array(n);
    let sp = 0;
    const push = (k) => { if (!gone[k] && paper[k]) { gone[k] = 1; stack[sp++] = k; } };
    for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
    for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
    while (sp) {
      const k = stack[--sp], x = k % w;
      if (x > 0) push(k - 1); if (x < w - 1) push(k + 1);
      if (k >= w) push(k - w); if (k < n - w) push(k + w);
    }
    for (let k = 0; k < n; k++) if (gone[k]) d[k * 4 + 3] = 0;
    // soft edge on pixels touching removed paper
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const k = y * w + x; if (gone[k]) continue;
      const near = (x > 0 && gone[k - 1]) || (x < w - 1 && gone[k + 1]) || (y > 0 && gone[k - w]) || (y < h - 1 && gone[k + w]);
      if (near) d[k * 4 + 3] = Math.round(d[k * 4 + 3] * Math.min(1, Math.max(0.3, (cut - ratio[k]) / 0.1 + 0.3)));
    }
    // 5) drop tiny leftover specks (paper grain, dust)
    const label = new Int32Array(n).fill(-1);
    const sizes = [];
    for (let s = 0; s < n; s++) {
      if (label[s] !== -1 || d[s * 4 + 3] === 0) continue;
      const id = sizes.length; let size = 0; sp = 0; stack[sp++] = s; label[s] = id;
      while (sp) {
        const k = stack[--sp], x = k % w; size++;
        const nb = [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1, k >= w ? k - w : -1, k < n - w ? k + w : -1];
        for (const q of nb) if (q >= 0 && label[q] === -1 && d[q * 4 + 3] > 0) { label[q] = id; stack[sp++] = q; }
      }
      sizes.push(size);
    }
    const biggest = Math.max(0, ...sizes);
    const minKeep = Math.max(25, biggest * 0.01);
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let k = 0; k < n; k++) {
      if (label[k] >= 0 && sizes[label[k]] < minKeep) { d[k * 4 + 3] = 0; continue; }
      if (d[k * 4 + 3] > 24) { const x = k % w, y = (k - x) / w; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
    return { minX, minY, maxX, maxY };
  }

  // ---------- background removal ----------
  function processImage(img, strength) {
    const maxSide = 420;
    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * scale));
    const h = Math.max(1, Math.round(img.naturalHeight * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    if (strength <= 0) return c.toDataURL('image/png');
    const data = ctx.getImageData(0, 0, w, h);
    const d = data.data;
    const { minX: x0, minY: y0, maxX: x1, maxY: y1 } = removePaper(d, w, h, strength);
    let minX = x0, minY = y0, maxX = x1, maxY = y1;
    ctx.putImageData(data, 0, 0);
    if (maxX < 0) return c.toDataURL('image/png');
    const pad = 4;
    minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad);
    maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
    const cw = maxX - minX + 1, ch = maxY - minY + 1;
    const out = document.createElement('canvas');
    out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(c, minX, minY, cw, ch, 0, 0, cw, ch);
    return (strength > 0 ? sticker(out) : out).toDataURL('image/png');
  }

  // ---------- monster creation ----------
  function makeMonster({ src, name, weak = '', sample = false, original = null, docId = null }) {
    const el = document.createElement('div');
    el.className = 'm';
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.innerHTML = '<span class="shadow"></span><span class="body"><img alt=""></span><span class="name"></span>';
    const img = el.querySelector('img');
    const bodyEl = el.querySelector('.body');
    img.src = src;
    el.querySelector('.name').textContent = name || '';
    el.setAttribute('aria-label', (name || '怪獸') + '，按一下跳起來');
    world.appendChild(el);

    const m = {
      el, img, bodyEl, name, weak, sample, original, docId, hiddenByHost: false,
      x: rand(40, Math.max(60, W() - 200)),
      y: rand(topPad(), Math.max(topPad() + 10, H() - botPad() - 160)),
      vx: rand(-1, 1), vy: rand(-0.6, 0.6),
      speed: rand(28, 70),
      size: 1, sizeVar: rand(0.85, 1.15),
      scale: 0.01, targetScale: 1,
      phase: rand(0, Math.PI * 2),
      bobRate: rand(5, 8),
      jumpT: 0, wiggleT: 0,
      nextTurn: performance.now() + rand(1500, 4500),
      pause: 0,
      flip: 1,
      gone: false, calm: 0,
      w: 120, h: 120
    };
    const norm = Math.hypot(m.vx, m.vy) || 1; m.vx /= norm; m.vy /= norm;

    const poke = (ev) => {
      if (ev) ev.preventDefault();
      if (ev && ev.type === 'click' && view.justDragged) return;
      if (m.gone) return;
      m.jumpT = 0.0001;
      hearts(m, 3, false);
      follow(m);
      const line = [m.name, m.weak ? '喜歡：' + m.weak : ''].filter(Boolean).join('・');
      if (line) bubble(m, line);
    };
    el.addEventListener('click', poke);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') poke(e); });
    el.addEventListener('mouseenter', () => { m.wiggleT = 0.0001; });

    monsters.push(m);
    return m;
  }

  function addSamples() {
    samples.forEach(s => {
      const src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.svg);
      const m = makeMonster({ src, name: s.name, weak: s.weak, sample: true });
      const im = new Image();
      im.onload = () => {
        const cv = document.createElement('canvas'); cv.width = 330; cv.height = 360;
        cv.getContext('2d').drawImage(im, 0, 0, 330, 360);
        m.img.src = sticker(cv).toDataURL('image/png'); m.w = 120;
      };
      im.src = src;
    });
    resize();
  }

  function removeSamples() {
    for (let i = monsters.length - 1; i >= 0; i--) {
      if (monsters[i].sample) { monsters[i].el.remove(); monsters.splice(i, 1); }
    }
  }

  async function addFiles(files) {
    const list = [...files].filter(f => f.type.startsWith('image/'));
    if (!list.length) { toast('只能放圖片檔喔'); return; }
    removeSamples();
    let added = 0;
    for (const f of list) {
      try {
        const url = URL.createObjectURL(f);
        const img = new Image();
        img.decoding = 'async';
        img.src = url;
        await img.decode();
        const src = processImage(img, +cutInput.value);
        makeMonster({ src, name: nameFromFile(f), original: img });
        added++;
      } catch (e) {
        // unreadable image: skip it
      }
    }
    resize();
    update();
    toast(added ? `加入了 ${added} 隻怪獸！` : '這些圖片讀不出來，換一張試試');
  }

  // ---------- effects ----------
  function hearts(m, n, calm) {
    const cx = m.x + m.w * m.scale / 2, cy = m.y + m.h * (1 - m.scale) + 10;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'heart' + (calm ? ' calm' : '');
      s.textContent = calm ? ['♪', '♫', '✿'][Math.floor(Math.random() * 3)] : '♥';
      s.style.left = (cx + rand(-m.w * 0.3, m.w * 0.3)) + 'px';
      s.style.top = (m.y + m.h * 0.3 + rand(-10, 10)) + 'px';
      s.style.setProperty('--dx', rand(-40, 40) + 'px');
      s.style.animationDelay = (i * 0.08) + 's';
      world.appendChild(s);
      setTimeout(() => s.remove(), 1600 + i * 80);
    }
  }

  function bubble(m, text) {
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    b.style.left = (m.x + m.w / 2) + 'px';
    b.style.top = Math.max(8, m.y + m.h * (1 - m.scale) - 46) + 'px';
    world.appendChild(b);
    setTimeout(() => b.remove(), 1700);
  }

  function relax() {
    if (!monsters.length) return;
    if (monsters.every(m => m.calm >= 1)) {
      monsters.forEach(m => hearts(m, 2, true));
      toast('大家都放鬆下來了 ♪');
      return;
    }
    monsters.forEach(m => {
      m.calm = Math.min(1, m.calm + 0.34);
      m.jumpT = 0.0001;
      hearts(m, 3, true);
      m.el.classList.toggle('relaxed', m.calm >= 1);
    });
    update();
    if (monsters.every(m => m.calm >= 1)) toast('大家都放鬆下來了 ♪ 壓力還在，但我們學會陪它了');
  }

  function revive() {
    monsters.forEach(m => { m.calm = 0; m.el.classList.remove('relaxed'); });
    update();
    toast('怪獸們又緊張起來了，再陪牠們放鬆一次吧');
  }

  function clearAll() {
    const now = performance.now();
    if (now - clearArmed > 3000) { clearArmed = now; toast('再按一次就會清空畫面，並開一個新場次（新的 QR code）'); return; }
    clearArmed = 0;
    monsters.forEach(m => m.el.remove());
    monsters.length = 0; relaxedCount = 0;
    addSamples(); update();
    if (window.MonsterPark.onClear) window.MonsterPark.onClear();
    toast('已清空，換回範例怪獸');
  }

  function update() {
    const real = monsters.filter(m => !m.sample);
    const list = real.length ? real : monsters;
    const calm = list.filter(m => m.calm >= 1).length;
    countEl.innerHTML = (real.length ? `怪獸 ${real.length} 隻` : `範例怪獸 ${monsters.length} 隻`) + (calm ? `・已放鬆 <b>${calm}</b>` : '');
  }

  function resize() {
    const s = baseSize();
    monsters.forEach(m => {
      const ratio = (m.img.naturalHeight && m.img.naturalWidth) ? m.img.naturalHeight / m.img.naturalWidth : 1;
      const w = s * m.sizeVar / Math.sqrt(Math.max(ratio, 0.35));
      m.w = w; m.h = w * ratio;
      m.el.style.width = w + 'px';
    });
  }

  function drawMap() {
    const w = W(), h = H();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    mapCanvas.width = Math.round(w * dpr); mapCanvas.height = Math.round(h * dpr);
    mapCanvas.style.width = w + 'px'; mapCanvas.style.height = h + 'px';
    const c = mapCanvas.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = '#e9cfa6'; c.fillRect(0, 0, w, h);

    const iw = mapImg.naturalWidth, ih = mapImg.naturalHeight;
    const s = Math.max(w / iw, h / ih);
    const dw = iw * s, dh = ih * s, dx = (w - dw) / 2, dy = (h - dh) / 2;
    c.imageSmoothingQuality = 'high';
    c.drawImage(mapImg, dx, dy, dw, dh);
    const P = (fx, fy) => [dx + fx * dw, dy + fy * dh];
    const [px, py] = P(0.7345, 0.68);
    MAP.ponds = [{ x: px, y: py, rx: 0.072 * dw, ry: 0.05 * dh }];

    MAP.bounds = { l: Math.max(0, dx + 0.03 * dw), r: Math.min(w, dx + 0.965 * dw), t: Math.max(0, dy + 0.05 * dh), b: Math.min(h, dy + 0.94 * dh) };

      if (d < 1) {

  let drag = null;
  stage.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false };
    else if (pointers.size === 2) { stopFollow(); const [a, b] = [...pointers.values()]; drag = { pinch: Math.hypot(a.x - b.x, a.y - b.y) || 1, s: view.s, moved: true }; }
  });
  window.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId) || !drag) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size >= 2 && drag.pinch) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (drag.s * d / drag.pinch) / view.s);
    } else if (pointers.size === 1 && !drag.pinch) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 6) { drag.moved = true; stopFollow(); stage.classList.add('dragging'); }
      if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); }
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (!pointers.size) {
      if (drag && drag.moved) { view.justDragged = true; setTimeout(() => { view.justDragged = false; }, 60); }
      drag = null; stage.classList.remove('dragging');
    } else if (pointers.size === 1) {
      const [p] = [...pointers.values()];
      drag = { x: p.x, y: p.y, vx: view.x, vy: view.y, moved: true };
    }
  };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);
  stage.addEventListener('wheel', (e) => { e.preventDefault(); stopFollow(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12); }, { passive: false });


  // ---------- camera follow ----------
  function follow(m) {
    if (!m) return;
    view.follow = m;
    view.followScale = Math.max(view.s, fitScale() * (bigScreen() ? 2.4 : 2));
  }
  function stopFollow() { view.follow = null; }
  function followStep(dt) {
    const m = view.follow;
    if (!m) return;
    const k = Math.min(1, dt * 4);
    view.s += (view.followScale - view.s) * k;
    const cx = m.x + m.w / 2, cy = m.y + m.h * 0.6;
    view.x += (VW() / 2 - cx * view.s - view.x) * k;
    view.y += (VH() / 2 - cy * view.s - view.y) * k;
    applyView();
  }

  // ---------- animation loop ----------
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    followStep(dt);
    const B0 = MAP.bounds || { t: 0, b: H() };
    const minY = Math.max(topPad(), B0.t), maxYb = Math.min(H() - botPad(), B0.b);
    for (const m of monsters) {
      if (m.img.complete && m.img.naturalWidth && m.w === 120) resize();
      m.scale += (m.targetScale - m.scale) * Math.min(1, dt * 6);
      if (m.gone && m.scale < 0.05) continue;

      const moving = now > m.pause;
      if (now > m.nextTurn) {
        if (Math.random() < 0.25) { m.pause = now + rand(800, 2000); }
        const ang = Math.atan2(m.vy, m.vx) + rand(-1.4, 1.4);
        m.vx = Math.cos(ang); m.vy = Math.sin(ang) * 0.7;
        m.nextTurn = now + rand(2000, 5000);
      }
      const sp = (reduced ? m.speed * 0.4 : m.speed) * (1 - 0.65 * m.calm);
      if (moving) { m.x += m.vx * sp * dt; m.y += m.vy * sp * dt; }

      const mw = m.w, mh = m.h;
      const B = MAP.bounds || { l: 0, r: W(), t: 0, b: H() };
      if (m.x < B.l) { m.x = B.l; m.vx = Math.abs(m.vx); }
      if (m.x > B.r - mw) { m.x = Math.max(B.l, B.r - mw); m.vx = -Math.abs(m.vx); }
      if (m.y < minY - mh * 0.2) { m.y = minY - mh * 0.2; m.vy = Math.abs(m.vy); }
      if (m.y > maxYb - mh) { m.y = Math.max(minY, maxYb - mh); m.vy = -Math.abs(m.vy); }
      avoidPond(m);
      if (Math.abs(m.vx) > 0.15) m.flip = m.vx < 0 ? -1 : 1;

      m.phase += dt * m.bobRate * (moving ? 1 : 0.5) * (1 - 0.45 * m.calm);
      if (m.calm >= 1 && Math.random() < dt * 0.08) hearts(m, 1, true);
      const bob = reduced ? 0 : Math.abs(Math.sin(m.phase));
      let sx = 1 + (reduced ? 0 : (1 - bob) * 0.06);
      let sy = 1 - (reduced ? 0 : (1 - bob) * 0.06);
      let lift = moving ? bob * mh * 0.06 : bob * mh * 0.02;
      let rot = reduced ? 0 : Math.sin(m.phase * 0.5) * 6 * m.calm;

      if (m.jumpT > 0) {
        m.jumpT += dt / 0.6;
        const t = Math.min(1, m.jumpT);
        lift += Math.sin(Math.PI * t) * mh * 0.45;
        sy *= 1 + Math.sin(Math.PI * t) * 0.08;
        if (m.jumpT >= 1) m.jumpT = 0;
      }
      if (m.wiggleT > 0) {
        m.wiggleT += dt / 0.5;
        rot += Math.sin(m.wiggleT * Math.PI * 4) * 8 * (1 - Math.min(1, m.wiggleT));
        if (m.wiggleT >= 1) m.wiggleT = 0;
      }

      const sc = m.scale * depthScale(m);
      // keep the monster's feet planted while it shrinks
      const ox = m.x + mw * (1 - sc) / 2;
      const oy = m.y + mh * (1 - sc);
      m.el.style.transform = `translate(${ox}px, ${oy}px) scale(${sc})`;
      const z = Math.round(m.y + mh); if (z !== m.z) { m.z = z; m.el.style.zIndex = String(z); }
      m.bodyEl.style.transform =
        `translateY(${-lift}px) rotate(${rot}deg) scale(${sx * m.flip}, ${sy})`;
    }
    requestAnimationFrame(tick);
  }

  // ---------- controls ----------
  fileInput.addEventListener('change', () => { if (fileInput.files.length) addFiles(fileInput.files); fileInput.value = ''; });

  let cutTimer;
  cutInput.addEventListener('input', () => {
    clearTimeout(cutTimer);
    cutTimer = setTimeout(() => {
      monsters.forEach(m => {
        if (m.original) { m.img.src = processImage(m.original, +cutInput.value); m.w = 120; }
      });
    }, 150);
  });

  const namesBtn = document.getElementById('names');
  namesBtn.addEventListener('click', () => {
    const on = namesBtn.getAttribute('aria-pressed') !== 'true';
    namesBtn.setAttribute('aria-pressed', String(on));
    document.body.classList.toggle('hide-names', !on);
  });
  document.getElementById('relax').addEventListener('click', relax);
  document.getElementById('fit').addEventListener('click', resetView);
  document.getElementById('revive').addEventListener('click', revive);
  document.getElementById('clear').addEventListener('click', clearAll);
  document.getElementById('full').addEventListener('click', async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (e) { toast('這個環境不能全螢幕，可以按 F11'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT')) return;
    if (e.code === 'KeyR' && !e.ctrlKey && !e.metaKey) relax();
  });

  // drag & drop
  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if ([...(e.dataTransfer?.types || [])].includes('Files')) { dragDepth++; dropEl.hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) dropEl.hidden = true; });
  window.addEventListener('dragover', (e) => e.preventDefault());
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dragDepth = 0; dropEl.hidden = true;
    if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
  });
  window.addEventListener('paste', (e) => {
    const files = [...(e.clipboardData?.files || [])];
    if (files.length) addFiles(files);
  });
  window.addEventListener('resize', () => { sizeWorld(); drawMap(); resize(); resetView(); });

  window.MonsterPark = {
    toast,
    follow, stopFollow,
    findDoc(id) { return monsters.find(m => m.docId === id) || null; },
    markMine(m) { if (!m || m.el.querySelector('.mine-tag')) return; const t = document.createElement('span'); t.className = 'mine-tag'; t.textContent = '你的怪獸'; m.el.appendChild(t); },
    addRemote(src, name, weak, docId) {
      removeSamples();
      const m = makeMonster({ src, name: (name || '').slice(0, 16), weak: (weak || '').slice(0, 20), docId });
      m.x = rand(0, Math.max(0, W() - 200));
      m.y = topPad();
      m.scale = 0.01;
      m.jumpT = 0.0001;
      resize(); update();
      setTimeout(() => { hearts(m, 5, false); bubble(m, (name || '新怪獸') + ' 來了！'); }, 300);
      if (window.MonsterPark.onAdded) window.MonsterPark.onAdded(m);
      return m;
    },
    onClear: null
  };

  sizeWorld();
  drawMap();
  resetView();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawMap);
  document.body.classList.add('hide-names');
  addSamples();
  update();
  requestAnimationFrame(tick);
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const configured = firebaseConfig && firebaseConfig.apiKey && !String(firebaseConfig.apiKey).includes('貼上');
const P = window.MonsterPark;
if (!configured) {
  setTimeout(() => P.toast('還沒設定 Firebase：目前只能用「加入怪獸」從電腦放照片'), 600);
} else {
  const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const { getFirestore, collection, query, where, onSnapshot } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const newCode = () => Math.random().toString(36).slice(2, 7).toUpperCase();
  // ?room=CODE opens the map as a viewer (phones), otherwise this is the host screen
  const urlRoom = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
  const viewer = !!urlRoom;
  let room = urlRoom;
  if (!viewer) {
    try { room = localStorage.getItem('monster-room'); } catch (e) {}
    if (!room) room = newCode();
  }
  const save = () => { if (viewer) return; try { localStorage.setItem('monster-room', room); } catch (e) {} };
  save();

  const uploadUrl = () => new URL('upload.html?room=' + room, location.href).href;
  const small = document.getElementById('qrSmall');
  const large = document.getElementById('qrLarge');
  const chip = document.getElementById('qrChip');
  const big = document.getElementById('qrBig');
  const btn = document.getElementById('qrBtn');
  function drawQR() {
    small.innerHTML = ''; large.innerHTML = '';
    const url = uploadUrl();
    if (window.QRCode) {
      new QRCode(small, { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
      new QRCode(large, { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    } else {
      large.textContent = url;
    }
    document.getElementById('roomCode').textContent = room;
    large.nextElementSibling.title = url;
  }
  if (viewer) {
    document.body.classList.add('viewer');
    setTimeout(() => P.toast('正在看場次 ' + room + ' 的怪獸地圖'), 500);
    let mine = [];
    try { mine = JSON.parse(localStorage.getItem('my-monsters-' + room) || '[]'); } catch (e) {}
    const findBtn = document.getElementById('findMe');
    if (mine.length) {
      findBtn.hidden = false;
      let turn = 0;
      P.onAdded = (m) => { if (mine.includes(m.docId)) P.markMine(m); };
      findBtn.addEventListener('click', () => {
        const found = mine.map(id => P.findDoc(id)).filter(Boolean);
        if (!found.length) { P.toast('還沒找到你的怪獸，稍等一下再按一次'); return; }
        const m = found[turn % found.length]; turn++;
        P.follow(m);
        P.toast((m.name || '你的怪獸') + ' 在這裡！拖曳地圖或按「全圖」就能離開');
      });
    }
  }
  else { chip.hidden = false; btn.hidden = false; }
  chip.addEventListener('click', () => { big.hidden = false; });
  btn.addEventListener('click', () => { big.hidden = !big.hidden; });
  big.addEventListener('click', () => { big.hidden = true; });

  let unsub = null;
  const seen = new Set();
  function listen() {
    if (unsub) unsub();
    seen.clear();
    const q = query(collection(db, 'monsters'), where('room', '==', room));
    unsub = onSnapshot(q, (snap) => {
      const added = snap.docChanges().filter(c => c.type === 'added' && !seen.has(c.doc.id));
      added.sort((a, b) => (a.doc.data().createdAt || 0) - (b.doc.data().createdAt || 0));
      added.forEach((c, i) => {
        seen.add(c.doc.id);
        const d = c.doc.data();
        if (typeof d.img !== 'string' || !d.img.startsWith('data:image/')) return;
        setTimeout(() => P.addRemote(d.img, String(d.name || ''), String(d.weak || ''), c.doc.id), i * 120);
      });
    }, () => P.toast('連不上雲端資料庫，請檢查網路或 Firebase 設定'));
  }
  P.onClear = () => { room = newCode(); save(); drawQR(); listen(); big.hidden = false; };
  drawQR();
  listen();
}
</script></body></html>
